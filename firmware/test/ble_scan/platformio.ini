; FuBoHeiSt – BLE-Empfangstest (Xiaomi LYWSD03MMC mit Custom-Firmware)
; Eigenständiges PlatformIO-Projekt, damit die Bringup-Firmware (Repo-Root) unverändert bleibt.
; Bauen:  cd firmware/test/ble_scan && pio run
; Flashen/Monitor:  pio run -t upload && pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-Mode 0 = USB-Serial/JTAG: Flashen, ROM-Bootlog und Serial laufen über
    ; denselben COM-Port (linke USB-C-Buchse "USB"). Mode 1 (USB-OTG/TinyUSB)
    ; würde die Buchse beim App-Start auf einen NEUEN COM-Port umschalten.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2

monitor_speed = 115200
