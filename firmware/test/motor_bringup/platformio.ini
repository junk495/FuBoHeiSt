; FuBoHeiSt – Motor-Bringup (Stufe 1: DRV8833/INA219/Ripple/DS18B20 testen)
; Eigenständiges PlatformIO-Projekt, damit die Logging-Firmware unverändert bleibt.
; Bauen/Flashen:  cd firmware/test/motor_bringup && pio run -t upload
; Serielles Kommando-Interface (115200 Baud): siehe README.md

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Board-Extra-Flags überschreiben (USB-Mode 0 = USB-Serial/JTAG) statt
; "-D…" in build_flags → vermeidet die Warnung "ARDUINO_USB_MODE redefined".
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Debug-Level über die Plattform-Option statt "-DCORE_DEBUG_LEVEL".
board_build.code_debug = 1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.0

monitor_speed = 115200
