; FuBoHeiSt – Firmware (Stufe 1: Hardware-Layer & Bringup-Diagnose)
; Ziel: ESP32-S3-DevKitC-1 mit ESP32-S3-WROOM-1-N16R8 (16 MB Flash, 8 MB PSRAM)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; --- Build-Flags ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; --- Libraries ---
; INA219 wird ohne Adafruit-Bibliothek direkt über Wire getrieben (siehe src/CurrentSense.cpp).
; DS18B20 über OneWire + DallasTemperature.
lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.0

monitor_speed = 115200
