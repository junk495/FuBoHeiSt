 ; FuBoHeiSt – PlatformIO-Projekt (Firmware: Sensor-Logging BTHome → ThingSpeak)
; Liegt im Repo-Root, damit die PlatformIO-IDE/CLI das Projekt beim Öffnen des Repos
; erkennt. Der Quellcode bleibt in firmware/ (siehe src_dir/include_dir).

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-Mode 0 = USB-Serial/JTAG: Flashen, Bootlog und Serial über denselben
    ; COM-Port (linke USB-Buchse "USB") – kein Port-Wechsel beim App-Start.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.0
    h2zero/NimBLE-Arduino@^2.5.2

monitor_speed = 115200
