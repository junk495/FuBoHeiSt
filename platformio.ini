 ; FuBoHeiSt – PlatformIO-Projekt (Firmware: Sensor-Logging BTHome → ThingSpeak)
; Liegt im Repo-Root, damit die PlatformIO-IDE/CLI das Projekt beim Öffnen des Repos
; erkennt. Der Quellcode bleibt in firmware/ (siehe src_dir/include_dir).

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; Board-Extra-Flags überschreiben (USB-Mode 0 = USB-Serial/JTAG) statt
; "-D…" in build_flags → vermeidet die Warnung "ARDUINO_USB_MODE redefined".
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; Debug-Level über die Plattform-Option statt "-DCORE_DEBUG_LEVEL".
board_build.code_debug = 1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
    pstolarz/OneWireNg@^0.14.1

monitor_speed = 115200
