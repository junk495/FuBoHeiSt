; FuBoHeiSt – PlatformIO-Projekt (Firmware Stufe 1: Hardware-Layer & Bringup-Diagnose)
; Liegt im Repo-Root, damit die PlatformIO-IDE/CLI das Projekt beim Öffnen des Repos
; erkennt. Der Quellcode bleibt in firmware/ (siehe src_dir/include_dir).

[platformio]
src_dir = firmware/src
include_dir = firmware/include
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8: 16 MB Quad-Flash + 8 MB Octal-PSRAM ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.0

monitor_speed = 115200
